name: CI

on:
  push:
    paths:
      - ".github/workflows/**"
      - ".clang-format"
      - ".clang-tidy"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "pixi.toml"
      - "pixi.lock"
      - "src/**"
      - "include/**"
      - "tools/**"
      - "test/**"
      - "examples/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".clang-format"
      - ".clang-tidy"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "pixi.toml"
      - "pixi.lock"
      - "src/**"
      - "include/**"
      - "tools/**"
      - "test/**"
      - "examples/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  test:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true

      - run: pixi run check

  clang:
    name: check (Ubuntu, Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true

      - run: pixi run check-clang

  sanitizers:
    name: test (Ubuntu, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true

      - run: pixi run test-sanitize
