name: CI

on:
  push:
    paths:
      - ".github/workflows/**"
      - ".clang-format"
      - ".clang-tidy"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "pixi.toml"
      - "pixi.lock"
      - "src/**"
      - "include/**"
      - "tools/**"
      - "test/**"
      - "examples/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".clang-format"
      - ".clang-tidy"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "pixi.toml"
      - "pixi.lock"
      - "src/**"
      - "include/**"
      - "tools/**"
      - "test/**"
      - "examples/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  test:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true

      - run: pixi run check

  bootstrap-smoke:
    name: bootstrap-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Bootstrap and check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\bootstrap.ps1
          .\.pixi\bin\pixi.exe run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bootstrap and check (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/bootstrap.sh
          ./.pixi/bin/pixi run check

  clang:
    name: check (Ubuntu, Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true

      - run: pixi run check-clang

  sanitizers:
    name: test (Ubuntu, Clang, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true

      - run: pixi run test-sanitize
